<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Stock League</title>
<meta name="description" content="A season-long fantasy game played with listed companies. Private leagues for friends and colleagues.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top">
    <div class="brand"><span>Fantasy Stock League</span><span id="wkLabel">Loading</span></div>
    <div class="headline" id="hl">Fantasy Stock League</div>
    <div class="purse">
      <div>Rank<b id="pRank">—</b></div>
      <div>Season points<b id="pPts">—</b></div>
      <div>Credits<b id="pCr">—</b></div>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="body" id="view"><div class="empty">Loading…</div></div>
  <div class="foot">
    Fictional currency. No real money, no real securities. Not investment advice.
    Prices are delayed closing values via Google Sheets.
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
